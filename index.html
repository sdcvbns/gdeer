<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل طالب الشامل | 2026</title>
    
    <!-- مكتبة HLS.js الأساسية لتشغيل m3u8 على المتصفحات التي لا تدعمه افتراضياً -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { -webkit-user-select: none; user-select: none; outline: none; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        
        /* التصميم الزجاجي الذي تفضله في مشروعك "مبيعات طالب" */
        .glass-container {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
        }

        .main-panel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 35px; padding: 35px; backdrop-filter: blur(25px);
            width: 85%; max-width: 360px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .btn-action {
            background: linear-gradient(135deg, #6750a4, #904af9); color: white;
            border: none; border-radius: 18px; padding: 18px; width: 100%; margin: 12px 0;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(103, 80, 164, 0.3);
        }
        .btn-action:active { transform: scale(0.94); opacity: 0.9; }

        /* طبقة الفيديو الكاملة */
        #video-wrap {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        .btn-close-video {
            position: absolute; top: 25px; right: 20px; background: rgba(0,0,0,0.5);
            color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 10px 20px; border-radius: 15px; z-index: 10000; cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

<div class="glass-container" id="ui-main">
    <div class="main-panel">
        <h2 style="margin-bottom: 30px; font-weight: 800; background: linear-gradient(to right, #fff, #904af9); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">مشغل طالب الذكي</h2>
        
        <button class="btn-action" onclick="fetchAndPlay('ch1')">تشغيل القناة الأولى (A2)</button>
        <button class="btn-action" style="background: linear-gradient(135deg, #311b92, #512da8);" onclick="fetchAndPlay('ch2')">تشغيل القناة الثانية (A3)</button>
    </div>
</div>

<div id="video-wrap">
    <button class="btn-close-video" onclick="killPlayer()">إغلاق ✕</button>
    <video id="vid-player" controls playsinline autoplay></video>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxQdwwVmb9xQISdFONnSkL7r4-74dB_BwTcNlWO_7O0_wUl5kivX8iSsqcIZtVZqqyr/exec';
    const video = document.getElementById('vid-player');
    let hls = new Hls();

    async function fetchAndPlay(key) {
        try {
            // جلب الرابط من Google Script مع منع الكاش لضمان أحدث البيانات
            const response = await fetch(`${scriptURL}?cache=${Date.now()}`);
            const data = await response.json();
            const streamUrl = data[key] || data.url;

            if (streamUrl) {
                document.getElementById('video-wrap').style.display = 'block';
                
                // 1. دعم المتصفحات التي لا تدعم HLS افتراضياً (مثل Chrome على الكمبيوتر)
                if (Hls.isSupported() && streamUrl.includes('m3u8')) {
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } 
                // 2. دعم الأجهزة التي تدعم HLS افتراضياً (مثل الآيفون وبعض متصفحات الأندرويد)
                else if (video.canPlayType('application/vnd.apple.mpegurl') || streamUrl.includes('mp4')) {
                    video.src = streamUrl;
                    video.play();
                }
                // 3. محاولة التشغيل المباشر لأي رابط آخر
                else {
                    video.src = streamUrl;
                    video.play();
                }
            } else {
                alert("عذراً، الرابط غير متاح حالياً");
            }
        } catch (e) {
            alert("فشل جلب البيانات من السيرفر");
        }
    }

    function killPlayer() {
        video.pause();
        hls.destroy(); // تدمير عملية البث بالكامل لمسح الذاكرة
        hls = new Hls(); // إعادة التهيئة للمرة القادمة
        video.src = "";
        video.load();
        document.getElementById('video-wrap').style.display = 'none';
    }
</script>

</body>
</html>
