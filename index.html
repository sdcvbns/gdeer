<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل طالب الفوري | النسخة المعتمدة</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        * { -webkit-user-select: none; user-select: none; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px; padding: 30px; backdrop-filter: blur(20px);
            width: 85%; max-width: 350px; text-align: center;
        }

        .ch-button {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 15px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s;
        }
        .ch-button:active { transform: scale(0.95); background: rgba(103, 80, 164, 0.2); }

        .dot { width: 12px; height: 12px; background: #6750a4; border-radius: 50%; box-shadow: 0 0 10px #6750a4; }

        #player-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        .video-js { width: 100% !important; height: 100% !important; }
        
        #close-layer {
            position: absolute; top: 20px; right: 20px; z-index: 10000;
            background: rgba(0, 0, 0, 0.6); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px; border-radius: 15px; cursor: pointer; backdrop-filter: blur(5px);
            font-weight: bold; font-size: 14px;
        }

        #msg { position: fixed; bottom: 20px; background: rgba(255,0,0,0.7); padding: 10px 20px; border-radius: 20px; display: none; z-index: 10001; }
    </style>
</head>
<body>

<div id="msg">حدث خطأ في تشغيل الرابط</div>

<div id="main-ui" class="glass-panel">
    <h2 style="background: linear-gradient(135deg, #6750a4, #904af9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px;">مشغل طالب</h2>
    
    <div class="ch-button" onclick="loadAndPlay('ch1')">
        <div class="dot"></div>
        <span>تشغيل القناة الأولى (A2)</span>
    </div>

    <div class="ch-button" onclick="loadAndPlay('ch2')">
        <div class="dot" style="background: #904af9;"></div>
        <span>تشغيل القناة الثانية (A3)</span>
    </div>
</div>

<div id="player-container">
    <button id="close-layer" onclick="stopPlayer()">✕ إغلاق البث</button>
    <video id="vid" class="video-js vjs-big-play-centered" controls playsinline></video>
</div>

<script>
    // الرابط الذي يعمل لديك
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxQdwwVmb9xQISdFONnSkL7r4-74dB_BwTcNlWO_7O0_wUl5kivX8iSsqcIZtVZqqyr/exec';
    const player = videojs('vid');

    // هذه هي الدالة التي سألت عنها، قمت بتطويرها لتعمل على GitHub
    async function loadAndPlay(channelKey) {
        const msg = document.getElementById('msg');
        msg.style.display = 'none';

        try {
            const response = await fetch(scriptURL + '?cache=' + Math.random());
            const data = await response.json();
            
            // جلب الرابط سواء كان اسمه ch1 أو url
            let finalUrl = data[channelKey] || data.url; 

            if (finalUrl) {
                finalUrl = finalUrl.trim();
                
                // التأكد من بروتوكول HTTPS للعمل على GitHub
                if (finalUrl.startsWith('http:')) {
                    finalUrl = finalUrl.replace('http:', 'https:');
                }

                document.getElementById('player-container').style.display = 'block';

                // تحديد النوع بدقة لحل مشكلة "Format not supported"
                let videoType = 'video/mp4';
                if (finalUrl.includes('m3u8')) {
                    videoType = 'application/x-mpegURL';
                }

                player.src({ 
                    src: finalUrl, 
                    type: videoType 
                });

                player.load();
                player.play().catch(() => {
                    player.muted(true);
                    player.play();
                });
            } else {
                showError("الرابط غير موجود في الشيت");
            }
        } catch (e) {
            showError("فشل الاتصال بـ Google Sheet");
        }
    }

    function showError(text) {
        const msg = document.getElementById('msg');
        msg.innerText = text;
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 4000);
    }

    function stopPlayer() {
        player.pause();
        document.getElementById('player-container').style.display = 'none';
    }
</script>
</body>
</html>
