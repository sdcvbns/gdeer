<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل طالب المطور | النسخة الشاملة</title>
    
    <!-- مكتبة Video.js مع دعم تلقائي للـ HLS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        * { -webkit-user-select: none; user-select: none; outline: none; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: sans-serif; }
        
        /* تصميم زجاجي عصري */
        .ui-screen {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; padding: 40px; backdrop-filter: blur(25px);
            width: 90%; max-width: 380px; text-align: center;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; border-radius: 20px; padding: 20px; width: 100%; margin: 15px 0;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .play-btn:active { background: #6750a4; transform: scale(0.95); }

        /* حاوية الفيديو */
        #video-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        .video-js { width: 100% !important; height: 100% !important; }

        .btn-exit {
            position: absolute; top: 30px; right: 25px; background: rgba(0,0,0,0.6);
            color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 10px 20px; border-radius: 15px; z-index: 10000;
        }
    </style>
</head>
<body>

<div class="ui-screen" id="main-ui">
    <div class="glass-box">
        <h2 style="margin-bottom: 30px;">مشغل طالب (2026)</h2>
        <button class="play-btn" onclick="openChannel('ch1')">القناة الأولى (A2)</button>
        <button class="play-btn" onclick="openChannel('ch2')">القناة الثانية (A3)</button>
    </div>
</div>

<div id="video-container">
    <button class="btn-exit" onclick="closePlayer()">إغلاق ✕</button>
    <video id="player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxQdwwVmb9xQISdFONnSkL7r4-74dB_BwTcNlWO_7O0_wUl5kivX8iSsqcIZtVZqqyr/exec';
    
    // إعداد المشغل
    const videoInstance = videojs('player', {
        fluid: true,
        responsive: true
    });

    async function openChannel(key) {
        try {
            const res = await fetch(`${scriptURL}?t=${Date.now()}`);
            const data = await res.json();
            const streamUrl = data[key] || data.url;

            if (streamUrl) {
                document.getElementById('video-container').style.display = 'block';

                // إجبار المشغل على التعرف على النوع لحل مشكلة "Format not support"
                let type = 'video/mp4'; 
                if (streamUrl.includes('m3u8')) {
                    type = 'application/x-mpegURL';
                }

                videoInstance.src({ src: streamUrl, type: type });
                videoInstance.play().catch(() => {
                    videoInstance.muted(true);
                    videoInstance.play();
                });
            }
        } catch (e) {
            alert("خطأ في الاتصال بالسيرفر");
        }
    }

    function closePlayer() {
        videoInstance.pause();
        videoInstance.dispose(); // حذف المشغل من الذاكرة تماماً
        location.reload(); // إعادة تحميل الصفحة لضمان تنظيف الذاكرة (حل فعال جداً للآيفون والأندرويد)
    }
</script>

</body>
</html>
