<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل طالب PRO</title>
    
    <!-- مكتبات الفيديو الاحترافية -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; }
        
        /* تصميم زجاجي لمشروع Sarmad Al-Agha */
        .glass-ui {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
        }

        .card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px; padding: 40px; backdrop-filter: blur(25px);
            width: 85%; max-width: 380px; text-align: center;
        }

        .btn-stream {
            background: linear-gradient(135deg, #6750a4, #904af9); color: white;
            border: none; border-radius: 20px; padding: 20px; width: 100%; margin: 12px 0;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        #player-box {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        .video-js { width: 100% !important; height: 100% !important; }

        .btn-close {
            position: absolute; top: 30px; right: 20px; background: rgba(0,0,0,0.6);
            color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 10px 20px; border-radius: 15px; z-index: 10000;
        }
    </style>
</head>
<body>

<div class="glass-ui">
    <div class="card">
        <h2 style="color: white; margin-bottom: 30px;">مشغل طالب 2026</h2>
        <button class="btn-stream" onclick="playNow('https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8?aws.manifestfilter=video_height:144-720;video_co')">
            تشغيل MBC Iraq
        </button>
    </div>
</div>

<div id="player-box">
    <div class="btn-close" onclick="stopNow()">إغلاق ✕</div>
    <video id="pro-player" class="video-js vjs-big-play-centered" playsinline></video>
</div>

<script>
    var vPlayer = videojs('pro-player', {
        controls: true,
        fluid: true,
        html5: { hls: { overrideNative: true } }
    });

    function playNow(url) {
        document.getElementById('player-box').style.display = 'block';
        vPlayer.src({
            src: url,
            type: 'application/x-mpegURL'
        });
        vPlayer.play().catch(function() {
            vPlayer.muted(true);
            vPlayer.play();
        });
    }

    function stopNow() {
        vPlayer.pause();
        vPlayer.reset();
        document.getElementById('player-box').style.display = 'none';
    }
</script>
</body>
</html>
