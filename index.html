<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل طالب المباشر | MBC Iraq</title>
    
    <style>
        * { -webkit-user-select: none; box-sizing: border-box; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; }
        
        .glass-bg {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
        }

        .panel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px; padding: 35px; backdrop-filter: blur(25px);
            width: 90%; max-width: 360px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .btn-direct {
            background: linear-gradient(135deg, #6750a4, #904af9); color: white;
            border: none; border-radius: 20px; padding: 20px; width: 100%; margin: 12px 0;
            font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-direct:active { transform: scale(0.95); opacity: 0.9; }

        #player-layer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .close-btn {
            position: absolute; top: 30px; right: 20px; background: rgba(0,0,0,0.6);
            color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 10px 20px; border-radius: 15px; z-index: 10000; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="glass-bg">
    <div class="panel">
        <h2 style="color: white; margin-bottom: 30px; letter-spacing: 1px;">مشغل طالب 2026</h2>
        
        <!-- تم دمج رابط MBC Iraq مباشرة -->
        <button class="btn-direct" onclick="playStream('https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8?aws.manifestfilter=video_height:144-720;video_co')">
            تشغيل MBC Iraq
        </button>

        <button class="btn-direct" style="background: #311b92;" onclick="alert('يرجى إضافة الرابط الثاني يدوياً')">
            القناة الثانية
        </button>
    </div>
</div>

<div id="player-layer">
    <div class="close-btn" onclick="stopStream()">إغلاق البث ✕</div>
    <video id="video-obj" controls playsinline autoplay></video>
</div>

<script>
    const video = document.getElementById('video-obj');

    function playStream(url) {
        if (url) {
            document.getElementById('player-layer').style.display = 'block';
            video.src = url;
            
            // محاولة التشغيل مع كتم الصوت إذا لزم الأمر (لسياسة آيفون)
            video.play().catch(() => {
                video.muted = true;
                video.play();
            });
        }
    }

    function stopStream() {
        video.pause();
        video.src = ""; 
        video.load();
        document.getElementById('player-layer').style.display = 'none';
    }
</script>

</body>
</html>
